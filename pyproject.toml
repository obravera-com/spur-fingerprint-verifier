[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spur-fingerprint-verifier"
version = "0.1.0"
description = "Reference verifier and conformance fixtures for the fingerprint schemes module of the SPUR evidence profile"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Brady Ridgway", email = "brady@obravera.com" }]
keywords = ["spur", "content-telemetry", "iscc", "fingerprint", "provenance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "iscc-core==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spur-fingerprint-verifier = "spur_fingerprint_verifier.__main__:main"

[project.urls]
Homepage = "https://obravera.com"
Source = "https://github.com/obravera-com/spur-fingerprint-verifier"
"SPUR Content Telemetry" = "https://github.com/SPUR-Coalition/telemetry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
