name: conformance

on:
  push:
  pull_request:

jobs:
  fixtures:
    name: recompute fixtures from a clean checkout
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: fixture runner
        run: spur-fingerprint-verifier fixtures fixtures/fingerprint
      - name: pytest
        run: python -m pytest -q
      - name: binary fixtures are reproducible
        run: |
          python tools/make_binary_fixtures.py
          git diff --exit-code -- fixtures/fingerprint/iscc-data/sources
